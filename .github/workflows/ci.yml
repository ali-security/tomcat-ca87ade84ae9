name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional comma-separated test classes (TestFoo or org/apache/x/TestFoo.java); empty runs the full suite'
        required: false
        default: ''

env:
  LC_ALL: en_US.UTF-8

jobs:
  JDKxx_Matrix:
    strategy:
      fail-fast: false
      matrix:
        isMain:
          - ${{ contains(github.ref, 'main') }}
        java: [ 24 ]
        os: [ ubuntu-latest ]
    name: JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
        cache-dependency-path: build.properties.default
    - name: Cache Ant build dependencies
      uses: actions/cache@v4
      with:
        path: ~/tomcat-build-libs
        key: tomcat-build-libs-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.properties.default') }}
    # Seal Security: tomcat-native 2.0.8 (the version build.properties.default
    # pins) so the JNI OpenSSL test variants run instead of skipping.
    - name: Build tomcat-native 2.0.8
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libapr1-dev libssl-dev
        v=2.0.8
        cd "$RUNNER_TEMP"
        curl -fsSL -o tcnative.tar.gz "https://archive.apache.org/dist/tomcat/tomcat-connectors/native/$v/source/tomcat-native-$v-src.tar.gz"
        echo "fd45533b9c34b008717d18ed49334c7286b93c849c487c1c42746f2998cc4a6ff0362e536a8b5124c6539847a92a9f7631c7638a21cd5d22134fe1a9bb0f0702  tcnative.tar.gz" | sha512sum -c -
        tar xzf tcnative.tar.gz
        cd "tomcat-native-$v-src/native"
        ./configure --with-apr=/usr/bin/apr-1-config --with-ssl=/usr --with-java-home="$JAVA_HOME" --prefix="$RUNNER_TEMP/tcnative"
        make -j4
        make install
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/tcnative/lib" >> "$GITHUB_ENV"
    # user1.jks (client cert) expired 2025-08-15; re-issue the test TLS chain.
    - name: Regenerate expired TLS test fixtures
      run: bash .github/seal-regen-tls-fixtures.sh test/org/apache/tomcat/util/net
    - name: Build
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          echo "test-filter is set: smoke tests not run here; the selected tests run in the Full test suite job"
          ant -noinput echoproperties deploy embed
        else
          ant -noinput echoproperties deploy embed test-nio test-status
        fi
      env:
        ANT_OPTS: -Dtest.openssl.exists=false -Dtest.excludePerformance=true -Dtest.exclude=jakarta/servlet/http/TestHttpServletResponseSendError.java,org/apache/catalina/authenticator/TestFormAuthenticatorA.java,org/apache/catalina/authenticator/TestFormAuthenticatorB.java,org/apache/catalina/authenticator/TestFormAuthenticatorC.java,org/apache/catalina/authenticator/TestSSOnonLoginAndBasicAuthenticator.java,org/apache/catalina/authenticator/TestSSOnonLoginAndDigestAuthenticator.java,org/apache/catalina/core/TestAsyncContextImpl.java,org/apache/catalina/core/TestAsyncContextStateChanges.java,org/apache/catalina/core/TestStandardContextResources.java,org/apache/catalina/core/TestStandardWrapper.java,org/apache/catalina/loader/TestVirtualContext.java,org/apache/catalina/mapper/TestMapperWebapps.java,org/apache/catalina/nonblocking/TestNonBlockingAPI.java,org/apache/catalina/servlets/TestDefaultServletEncodingPassThroughBom.java,org/apache/catalina/servlets/TestDefaultServletEncodingWithBom.java,org/apache/catalina/servlets/TestDefaultServletEncodingWithoutBom.java,org/apache/catalina/servlets/TestDefaultServletIfMatchRequests.java,org/apache/catalina/servlets/TestDefaultServlet.java,org/apache/catalina/servlets/TestDefaultServletOptions.java,org/apache/catalina/servlets/TestWebdavServletOptionsFile.java,org/apache/catalina/startup/TestContextConfig.java,org/apache/catalina/startup/TestHostConfigAutomaticDeploymentA.java,org/apache/catalina/startup/TestHostConfigAutomaticDeploymentB.java,org/apache/catalina/startup/TestHostConfigAutomaticDeploymentC.java,org/apache/catalina/valves/rewrite/TestRewriteValve.java,org/apache/catalina/valves/TestStuckThreadDetectionValve.java,org/apache/coyote/ajp/TestAbstractAjpProcessor.java,org/apache/coyote/http11/filters/TestChunkedInputFilter.java,org/apache/coyote/http11/TestHttp11InputBufferCRLF.java,org/apache/coyote/http11/TestHttp11InputBuffer.java,org/apache/coyote/http11/TestHttp11Processor.java,org/apache/coyote/http2/TestAsync.java,org/apache/coyote/http2/TestHttp2ConnectionTimeouts.java,org/apache/coyote/http2/TestHttp2Limits.java,org/apache/coyote/http2/TestHttp2Section_6_8.java,org/apache/coyote/http2/TestHttp2Timeouts.java,org/apache/coyote/http2/TestStreamQueryString.java,org/apache/el/TestELInJsp.java,org/apache/jasper/compiler/TestCompiler.java,org/apache/jasper/compiler/TestEncodingDetector.java,org/apache/jasper/compiler/TestGenerator.java,org/apache/jasper/compiler/TestJspConfig.java,org/apache/jasper/compiler/TestJspDocumentParser.java,org/apache/jasper/compiler/TestValidator.java,org/apache/jasper/optimizations/TestELInterpreterTagSetters.java,org/apache/jasper/optimizations/TestStringInterpreterTagSetters.java,org/apache/jasper/runtime/TestCustomHttpJspPage.java,org/apache/jasper/runtime/TestJspContextWrapper.java,org/apache/jasper/runtime/TestJspRuntimeLibrary.java,org/apache/jasper/runtime/TestPageContextImpl.java,org/apache/jasper/servlet/TestTldScanner.java,org/apache/naming/resources/TestWarDirContext.java,org/apache/naming/TestEnvEntry.java,org/apache/tomcat/util/net/TestClientCert.java,org/apache/tomcat/util/net/TestCustomSslTrustManager.java,org/apache/tomcat/util/net/TestSSLHostConfigCompat.java,org/apache/tomcat/util/net/TestSsl.java,org/apache/tomcat/websocket/server/TestSlowClient.java,org/apache/tomcat/websocket/server/TestWsRemoteEndpointImplServerDeadlock.java,org/apache/tomcat/websocket/TestWebSocketFrameClientSSL.java,org/apache/tomcat/websocket/TestWsWebSocketContainer.java,org/apache/tomcat/websocket/TestWsWebSocketContainerTimeoutServer.java,org/apache/catalina/tribes/group/interceptors/TestTcpFailureDetector.java,org/apache/catalina/filters/TestRateLimitFilter.java,jakarta/servlet/http/TestHttpServletDoHeadInvalidWrite*.java,jakarta/servlet/http/TestHttpServletDoHeadValidWrite*.java

    - name: Test summary
      if: ${{ !cancelled() && inputs.test-filter == '' }}
      run: bash .github/seal-test-summary.sh output/build/logs

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: JDK${{ matrix.java }}-${{ matrix.os }}-logs
        path: |
          hs_err_*.log
          output/build/logs/TEST*.txt
        retention-days: 7

  # Seal Security: the smoke job above runs an upstream-curated subset and uploads
  # no jar. Release_Jar builds the shipped tomcat-embed-core jar on JDK 24 (the
  # release JDK, build.properties.release: release-java-version=24.0.1+9) and
  # uploads it. -Drelease.java.version=99 keeps build.xml's has-ffm condition
  # unset so the FFM/panama classes, which the public 10.1.41 jar does not
  # contain, are not compiled into it.
  Release_Jar:
    name: Release jar (JDK 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: temurin
        cache: maven
        cache-dependency-path: build.properties.default
    - name: Cache Ant build dependencies
      uses: actions/cache@v4
      with:
        path: ~/tomcat-build-libs
        key: tomcat-build-libs-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.properties.default') }}
    - name: Build embedded jars
      run: |
        java -version
        ant -version
        ant -noinput -Drelease.java.version=99 embed-jars
        mkdir -p seal-dist
        cp output/embed/tomcat-embed-core.jar seal-dist/tomcat-embed-core-10.1.41.jar
        unzip -l seal-dist/tomcat-embed-core-10.1.41.jar | tail -n 1
        md5sum seal-dist/tomcat-embed-core-10.1.41.jar
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: tomcat-embed-core-jar
        path: seal-dist/tomcat-embed-core-10.1.41.jar
        if-no-files-found: error
        retention-days: 7

  # Seal Security: full test suite (not only the smoke subset) for every package
  # shipped in tomcat-embed-core, on both NIO and NIO2 connectors, on JDK 24 so
  # the OpenSSL FFM (panama) variants run too, with tomcat-native 2.0.8 (the
  # version build.properties.default pins) so the JNI OpenSSL variants run.
  Full_Tests:
    name: Full suite JDK24 NIO+NIO2 (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: catalina
            tests: 'org/apache/catalina/**/Test*.java'
          - leg: coyote
            tests: 'org/apache/coyote/**/Test*.java'
          - leg: tomcat
            tests: 'org/apache/tomcat/**/Test*.java'
          - leg: servlet-juli-naming
            tests: 'jakarta/**/Test*.java,org/apache/juli/**/Test*.java,org/apache/naming/**/Test*.java'
          - leg: performance
            tests: 'jakarta/**/Test*Performance.java,org/apache/catalina/**/Test*Performance.java,org/apache/coyote/**/Test*Performance.java,org/apache/tomcat/**/Test*Performance.java,org/apache/juli/**/Test*Performance.java,org/apache/naming/**/Test*Performance.java'
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: temurin
        cache: maven
        cache-dependency-path: build.properties.default
    - name: Cache Ant build dependencies
      uses: actions/cache@v4
      with:
        path: ~/tomcat-build-libs
        key: tomcat-build-libs-${{ github.job }}-${{ runner.os }}-${{ hashFiles('build.properties.default') }}
    - name: Build tomcat-native 2.0.8
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libapr1-dev libssl-dev openssl
        v=2.0.8
        cd "$RUNNER_TEMP"
        curl -fsSL -o tcnative.tar.gz "https://archive.apache.org/dist/tomcat/tomcat-connectors/native/$v/source/tomcat-native-$v-src.tar.gz"
        echo "fd45533b9c34b008717d18ed49334c7286b93c849c487c1c42746f2998cc4a6ff0362e536a8b5124c6539847a92a9f7631c7638a21cd5d22134fe1a9bb0f0702  tcnative.tar.gz" | sha512sum -c -
        tar xzf tcnative.tar.gz
        cd "tomcat-native-$v-src/native"
        ./configure --with-apr=/usr/bin/apr-1-config --with-ssl=/usr --with-java-home="$JAVA_HOME" --prefix="$RUNNER_TEMP/tcnative"
        make -j4
        make install
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/tcnative/lib" >> "$GITHUB_ENV"
        openssl version
    # user1.jks (client cert) expired 2025-08-15; re-issue the test TLS chain.
    - name: Regenerate expired TLS test fixtures
      run: bash .github/seal-regen-tls-fixtures.sh test/org/apache/tomcat/util/net
    - name: Test
      run: |
        filter="${{ inputs.test-filter }}"
        leg="${{ matrix.leg }}"
        threads=4
        perf=true
        names='${{ matrix.tests }}'
        if [ -n "$filter" ]; then
          if [ "$leg" != catalina ]; then
            echo "test-filter is set: the selected tests run in the catalina leg only"
            exit 0
          fi
          names=""
          IFS=',' read -ra toks <<< "$filter"
          for t in "${toks[@]}"; do
            case "$t" in */*) p="$t" ;; *) p="**/$t" ;; esac
            case "$p" in *.java) ;; *) p="$p.java" ;; esac
            names="${names:+$names,}$p"
          done
          perf=false
        elif [ "$leg" = performance ]; then
          threads=1
          perf=false
        fi
        echo "Running test.name=$names threads=$threads excludePerformance=$perf"
        ant -noinput test-nio test-nio2 \
          -Dtest.threads=$threads -Dtest.verbose=false \
          -Dtest.excludePerformance=$perf \
          -Dtest.apr.loc="$RUNNER_TEMP/tcnative/lib" \
          -Dtest.openssl.path=/usr/bin/openssl \
          -Dtest.name="$names" \
          test-status
    - name: Test summary
      if: ${{ !cancelled() && (inputs.test-filter == '' || matrix.leg == 'catalina') }}
      run: bash .github/seal-test-summary.sh output/build/logs
    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: full-tests-${{ matrix.leg }}-logs
        path: |
          hs_err_*.log
          output/build/logs/TEST*.txt
        retention-days: 7
